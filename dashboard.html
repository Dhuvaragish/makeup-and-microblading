<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Dashboard | VELOURA PMU & Brow Studio</title>
  <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg">
  <link rel="stylesheet" id="bootstrap-css" href="css/bootstrap.min.css">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/components.css">
  <script src="js/storage.js"></script>
  <script>
    (function() {
      // Check authentication immediately before page render
      var user = window.PMUStorage ? window.PMUStorage.getCurrentUser() : null;
      if (user) {
        if (user.role === 'admin') {
          window.location.replace('client-dashboard.html');
        } else {
          window.location.replace('client-dashboard.html');
        }
      } else {
        sessionStorage.setItem('pmu_auth_redirect_msg', 'Please sign in to access your customer dashboard.');
        window.location.replace('login.html?redirect=client-dashboard.html');
      }
    })();
  </script>
</head>
<body style="background-color: var(--pmu-bg-main, #FAF8F4); color: var(--pmu-text-main, #201E1D); display: flex; align-items: center; justify-content: center; min-height: 100vh; font-family: var(--pmu-font-sans, sans-serif); text-align: center; margin: 0; padding: 1.5rem;">
  <div class="pmu-card p-4 p-md-5 text-center shadow-sm" style="max-width: 440px; width: 100%;">
    <img src="assets/icons/logo.svg" alt="VELOURA" width="48" height="48" class="mb-3 mx-auto">
    <h3 class="font-serif mb-2" style="color: var(--pmu-primary, #D6BC91);">VELOURA</h3>
    <p class="text-muted small mb-3">Connecting securely to your private customer lounge...</p>
    <div class="spinner-border text-gold mb-3" role="status" style="color: #D6BC91;">
      <span class="visually-hidden">Loading...</span>
    </div>
    <div>
      <a href="client-dashboard.html" class="btn btn-sm btn-pmu-gold">Open Dashboard</a>
    </div>
  </div>
</body>
</html>
