<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Rich metallic gold gradient matching Image 1 -->
    <linearGradient id="auraGoldBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dfcaa7"/>
      <stop offset="35%" stop-color="#c5a880"/>
      <stop offset="70%" stop-color="#faedd9"/>
      <stop offset="100%" stop-color="#a6875b"/>
    </linearGradient>

    <!-- Subtle golden rim -->
    <linearGradient id="auraGoldBorder" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a6875b"/>
      <stop offset="50%" stop-color="#faedd9"/>
      <stop offset="100%" stop-color="#c5a880"/>
    </linearGradient>

    <!-- Soft shadow filter -->
    <filter id="auraSoftShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#a6875b" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Circular background badge with champagne gold gradient -->
  <circle cx="50" cy="50" r="48" fill="url(#auraGoldBg)" filter="url(#auraSoftShadow)"/>
  <circle cx="50" cy="50" r="47" fill="none" stroke="url(#auraGoldBorder)" stroke-width="1"/>

  <!-- Serif Letter "A" matching Playfair Display in #1a1b1f -->
  <text x="50" y="66" font-family="'Playfair Display', Georgia, serif" font-size="46" font-weight="700" fill="#1a1b1f" text-anchor="middle">A</text>
</svg>
